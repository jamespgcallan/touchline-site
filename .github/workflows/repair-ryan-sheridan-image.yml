name: Repair Ryan Sheridan image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-ryan-sheridan-image.yml'
      - '.image-parts/ryan/**'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Rebuild and verify image
        run: |
          cat .image-parts/ryan/part* | base64 -d > images/ryan-sheridan-st-pats-shamrock-rovers.webp
          python - <<'PY'
          from pathlib import Path
          p = Path('images/ryan-sheridan-st-pats-shamrock-rovers.webp')
          b = p.read_bytes()
          assert b[:4] == b'RIFF', b[:12]
          assert b[8:12] == b'WEBP', b[:12]
          assert len(b) > 90000, len(b)
          print('Valid WebP:', len(b), 'bytes')
          PY

      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sleep 20
          git reset --hard HEAD
          git pull --rebase origin main
          cat .image-parts/ryan/part* | base64 -d > images/ryan-sheridan-st-pats-shamrock-rovers.webp
          python - <<'PY'
          from pathlib import Path
          b = Path('images/ryan-sheridan-st-pats-shamrock-rovers.webp').read_bytes()
          assert b[:4] == b'RIFF' and b[8:12] == b'WEBP' and len(b) > 90000
          PY
          git rm -r .image-parts/ryan
          git rm .github/workflows/repair-ryan-sheridan-image.yml
          git add images/ryan-sheridan-st-pats-shamrock-rovers.webp
          git commit -m "Repair Ryan Sheridan image [skip ci]"
          git push
