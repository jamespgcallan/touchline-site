name: Sync publication surfaces

on:
  push:
    branches: [main]
    paths:
      - '*.html'

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Sync news SEO
        run: python scripts/sync_news_seo.py

      - name: Sync publication discovery
        run: python scripts/sync_publication_discovery.py

      - name: Sync latest surfaces
        run: python scripts/sync_latest_surface.py

      - name: Sync search hierarchy
        run: python scripts/sync_search_hierarchy.py

      - name: Rebuild sitemap
        run: python scripts/sync_sitemap.py

      - name: Sync mobile navigation
        run: python scripts/sync_mobile_nav.py

      - name: Commit generated updates
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync publication surfaces"
          git push
