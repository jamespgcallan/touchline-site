name: Update Kitching article image

on:
  push:
    paths:
      - '.github/workflows/update-kitching-image.yml'

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace image URL
        run: |
          python - <<'PY'
          from pathlib import Path
          old = 'https://icdn.sheffunitedway.co.uk/wp-content/uploads/2026/09/HRd29S2XAAEjnBT.jpg'
          new = 'https://ichef.bbci.co.uk/ace/standard/866/cpsprodpb/cef0/live/9e8cf7d0-a627-11f1-b384-1f35d0eeee9d.jpg'
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if old in text:
                  path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/update-kitching-image.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use BBC image for Liam Kitching article' || exit 0
          git push
