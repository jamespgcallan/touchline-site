name: Site navigation and search discovery sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Rebuild publication discovery surfaces
        run: python scripts/sync_publication_discovery.py
      - name: Keep latest surfaces in sync
        run: python scripts/sync_latest_surface.py
      - name: Standardise site brand and search name
        run: python scripts/sync_site_brand.py
      - name: Standardise navigation
        run: python scripts/sync_mobile_nav.py
      - name: Strengthen search hierarchy and sitelink signals
        run: python scripts/sync_search_hierarchy.py
      - name: Apply Touchline Studios positioning
        run: python scripts/sync_touchline_studios.py
      - name: Preserve homepage Studios wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = text.replace('Touchline Sport also works within it.', 'Touchline Studios also works within it.')
          text = text.replace(
              '<a class="studios-note" href="about.html">About</a>',
              '<a class="studios-note" href="about.html">How the media and studio sides fit together</a>'
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Update Google News SEO
        run: python scripts/sync_news_seo.py
      - name: Rebuild canonical sitemap
        run: python scripts/sync_sitemap.py
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No site changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.xml'
          git commit -m "Sync Touchline Sport publication discovery and news SEO"
          git push
