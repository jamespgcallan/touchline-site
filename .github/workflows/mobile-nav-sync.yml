name: Site navigation and news SEO sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Standardise site brand and search name
        run: python scripts/sync_site_brand.py
      - name: Standardise navigation
        run: python scripts/sync_mobile_nav.py
      - name: Update Google News SEO
        run: python scripts/sync_news_seo.py
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No site changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.xml'
          git commit -m "Sync Touchline Sport brand, navigation and Google News SEO"
          git push
