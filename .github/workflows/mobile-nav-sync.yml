name: Site navigation and search discovery sync

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Rebuild publication discovery surfaces
        run: python scripts/sync_publication_discovery.py
      - name: Remove duplicate related article modules
        run: python scripts/cleanup_related_duplicates.py
      - name: Keep latest surfaces in sync
        run: python scripts/sync_latest_surface.py
      - name: Standardise site brand and search name
        run: python scripts/sync_site_brand.py
      - name: Standardise navigation
        run: python scripts/sync_mobile_nav.py
      - name: Refresh article sharing asset
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = re.sub(
                  r'<script src="article-share\.js(?:\?[^\"]*)?"></script>',
                  '<script src="article-share.js?v=20260916-sharefix"></script>',
                  text,
              )
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
      - name: Strengthen search hierarchy and sitelink signals
        run: python scripts/sync_search_hierarchy.py
      - name: Apply Touchline Studios positioning
        run: python scripts/sync_touchline_studios.py
      - name: Preserve commercial Studios wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          homepage = Path('index.html')
          text = homepage.read_text(encoding='utf-8')
          text = text.replace('Touchline Sport also works within it.', 'Touchline Studios also works within it.')
          text = text.replace(
              '<a class="studios-note" href="about.html">About</a>',
              '<a class="studios-note" href="about.html">How the media and studio sides fit together</a>'
          )
          homepage.write_text(text, encoding='utf-8')

          about = Path('about.html')
          text = about.read_text(encoding='utf-8')
          text = text.replace(
              'Independent football journalism from Touchline Sport, alongside PR, communications and strategy work through Touchline Sport.',
              'Independent football journalism from Touchline Sport, alongside PR, communications and strategy work through Touchline Studios.'
          )
          about.write_text(text, encoding='utf-8')

          james = Path('james-callan.html')
          text = james.read_text(encoding='utf-8')
          text = text.replace(
              'Irish football writer and communications strategist, and founder of Touchline Sport and Touchline Sport.',
              'Irish football writer and communications strategist, and founder of Touchline Sport and Touchline Studios.'
          )
          james.write_text(text, encoding='utf-8')
          PY
      - name: Update Google News SEO
        run: python scripts/sync_news_seo.py
      - name: Rebuild canonical sitemap
        run: python scripts/sync_sitemap.py
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No site changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '*.xml'
          git commit -m "Sync Touchline Sport publication discovery and news SEO"
          git push
