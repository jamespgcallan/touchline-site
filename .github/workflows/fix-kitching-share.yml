name: Fix Kitching share controls
on:
  push:
    paths:
      - '.github/workflows/fix-kitching-share.yml'
permissions:
  contents: write
jobs:
  fix-share:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add share bar
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('liam-kitching-ireland-call-up-rocco-vata.html')
          s = p.read_text()
          css = ".share-row{display:flex;align-items:center}.share-row-top{justify-content:flex-end;margin-top:16px}.share-row-bottom{justify-content:flex-start;margin:20px 0 8px}.share-button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:9px 14px;border:1px solid var(--line)!important;border-radius:99px;background:transparent!important;color:var(--ink-soft)!important;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer}.share-button:hover{color:var(--accent)!important;background:var(--accent-soft)!important}"
          if '.share-row{' not in s:
              s = s.replace('</style>\n<link rel="alternate"', css + '\n</style>\n<link rel="alternate"', 1)
          top_old = '<div class="article-meta"><a class="byline" href="james-callan.html">James Callan</a><span class="dot"></span><time datetime="2026-09-17T12:21:00+01:00">17 Sep 2026</time><span class="dot"></span><span>6 min read</span></div></section>'
          top_new = '<div class="article-meta"><a class="byline" href="james-callan.html">James Callan</a><span class="dot"></span><time datetime="2026-09-17T12:21:00+01:00">17 Sep 2026</time><span class="dot"></span><span>6 min read</span></div><div class="share-row share-row-top"><button class="share-button" type="button" data-share-button data-share-title="Liam Kitching Earns First Ireland Call-Up as Rocco Vata Returns">Share article</button></div></section>'
          if 'share-row share-row-top' not in s:
              s = s.replace(top_old, top_new, 1)
          bottom_old = '<div class="cta-box"><p>If this one landed, the newsletter’s where the rest of it lives — two or three pieces a week, no noise.</p>'
          bottom_new = '<div class="share-row share-row-bottom"><button class="share-button" type="button" data-share-button data-share-title="Liam Kitching Earns First Ireland Call-Up as Rocco Vata Returns">Share article</button></div>\n<div class="cta-box"><p>If this one landed, the newsletter’s where the rest of it lives — two or three pieces a week, no noise.</p>'
          if 'share-row share-row-bottom' not in s:
              s = s.replace(bottom_old, bottom_new, 1)
          p.write_text(s)
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-kitching-share.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add liam-kitching-ireland-call-up-rocco-vata.html .github/workflows/fix-kitching-share.yml
          git commit -m 'Add share controls to Liam Kitching article'
          git push