name: Fix Sheridan homepage image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-sheridan-homepage-image.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Restore self-hosted Sheridan image with cache bust
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sleep 12
          git pull --rebase origin main
          python - <<'PY'
          from pathlib import Path
          old = 'https://kommodo.ai/i/GBJ0bzsgInyLzrwsQGX8'
          new = 'https://touchlinesport.net/images/ryan-sheridan-st-pats-shamrock-rovers.webp?v=20260912c'
          changed=[]
          for path in Path('.').glob('*.html'):
              text=path.read_text(encoding='utf-8')
              updated=text.replace(old,new)
              if updated != text:
                  path.write_text(updated,encoding='utf-8')
                  changed.append(str(path))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
          git rm .github/workflows/fix-sheridan-homepage-image.yml
          git add -- '*.html'
          git commit -m "Fix Ryan Sheridan homepage image source"
          git pull --rebase origin main
          git push
