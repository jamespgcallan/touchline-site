name: Remove Kitching opening paragraph

on:
  push:
    paths:
      - '.github/workflows/remove-kitching-opening-paragraph.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove requested paragraph
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('liam-kitching-ireland-call-up-rocco-vata.html')
          text = path.read_text(encoding='utf-8')
          target = "<p>Liam Kitching has earned his first Republic of Ireland call-up, Rocco Vata is back after 18 months away and Owen Elding can finally turn months of training around the senior setup into a place in the actual squad.</p>\n"
          if target not in text:
              raise SystemExit('Target paragraph not found')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liam-kitching-ireland-call-up-rocco-vata.html
          git commit -m "Remove opening paragraph from Liam Kitching article"
          git push
