name: Sync site navigation links (manual fallback)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-nav:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep Work With Us available
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          work_link = '<a href="work-with-me.html">Work With Us</a>'
          changed = []

          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('<a href="work-with-me.html">Work With Me</a>', work_link)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit navigation links
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Navigation links already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Keep Work With Us in navigation"
          git push
