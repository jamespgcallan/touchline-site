name: Sync site navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-nav:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep desktop and mobile navigation on every HTML page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          work_link = '<a href="work-with-me.html">Work With Me</a>'
          mobile_script = '<script src="mobile-nav.js" defer></script>'
          changed = []

          for path in Path('.').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              updated = text

              if 'work-with-me.html' not in updated:
                  replacements = [
                      ('<a href="index.html#pillars">About</a>', work_link + '\n      <a href="index.html#pillars">About</a>'),
                      ('<a href="#pillars">About</a>', work_link + '\n      <a href="#pillars">About</a>'),
                      ('<a href="index.html#subscribe">Newsletter</a>', work_link + '\n      <a href="index.html#subscribe">Newsletter</a>'),
                      ('<a href="#subscribe">Newsletter</a>', work_link + '\n      <a href="#subscribe">Newsletter</a>'),
                  ]
                  for old, new in replacements:
                      if old in updated:
                          updated = updated.replace(old, new, 1)
                          break

              if 'mobile-nav.js' not in updated and '</body>' in updated:
                  updated = updated.replace('</body>', mobile_script + '\n</body>', 1)

              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit navigation updates
        shell: bash
        run: |
          if git diff --quiet -- '*.html'; then
            echo "Navigation already consistent."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "Add mobile menu to all site pages"
          git push
